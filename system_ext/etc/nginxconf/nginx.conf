# Copyright 2024-2025 Sony Corporation
# -*-nginx-*-
#
# NOTICE: Lines tagged as (default) mean they explicitly set default values
#         for now in order to notice that they can be, or rather, SHOULD BE
#         changed according to the runtime enviromenent of DTV's.

worker_processes        1;      # (default)
worker_priority         0;      # (default)

daemon off;

#user nobody nobody;    # (default)
                        # Available only if run by root
                        # To be other uid/gid, uncomment and edit the line.

#user root;	#Should not be removed as long as nginx is started as root in NFS mode.

# LOG SETTINGS
# error log on
#error_log      /mnt/product/tmp/sony/nginx/data/user/error.log  error;
# error log off
error_log       /dev/null crit;

events {
    worker_connections  384;    # (default 512) Max connections per worker

    # EVENT MODEL
    #   Nginx provides some kinds of event models:
    #      [ kqueue | rtsig | epoll | /dev/poll | select | poll | eventport ]
    #   In Linux, select, poll, rtsig and epoll are available. (The others
    #   are for other UN*X OS's)
    #   We use 'epoll' since it is the most effective method in them.
#   use                     epoll;  # (default)
#   epoll_events            512;    # (default)
#   worker_aio_requests     32;     # (default)
}

http {
    # access log off
    access_log                      off;
    open_log_file_cache             off;
    log_not_found                   off;
    log_subrequest                  off;
    # access log on
    #open_log_file_cache max=2 inactive=20s min_uses=1 valid=10m;
    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';
    #access_log                     /mnt/product/tmp/sony/nginx/data/user/access.log main;
    #log_not_found                  off;
    #log_subrequest                 off;
    #rewrite_log                    off;
    #uninitialized_variable_warn    off;

    # MIME TYPES
    include                         /system_ext/etc/nginxconf/mime.types;

    # ON-MEMORY FILE CACHING
#   open_file_cache                 off;    # (default) Not to use on-memory file caching

    # TEMPORARY FILE PATHS
    client_body_temp_path           /mnt/product/tmp/sony/nginx/data/client_body_temp;
    proxy_temp_path                 /mnt/product/tmp/sony/nginx/data/proxy_temp;
#   fastcgi_temp_path               /mnt/product/tmp/sony/nginx/data/fastcgi_temp;  #Module not installed
#   scgi_temp_path                  /mnt/product/tmp/sony/nginx/data/scgi_temp;  #Module not installed
#   uwsgi_temp_path                 /mnt/product/tmp/sony/nginx/data/uwsgi_temp;   #Module not installed

    # COMMON BUFFER SETTINGS
#   We should check out: http://wiki.nginx.org/Optimizations
#   to optimize our system effectively.
#   variables_hash_max_size         512;    # (default)
#   variables_hash_bucket_size      64;     # (default)

    server_names_hash_max_size      128;
    server_names_hash_bucket_size   32;     # (default)

#   types_hash_max_size             1024;   # (default)
#   types_hash_bucket_size          32;     # (default)

#   connection_pool_size            256;    # (default)
#   request_pool_size               4k;     # (default)

    # CLIENT BUFFER SETTINGS
    client_header_buffer_size       1k;     # (default, required)
    client_body_buffer_size         8k;     # (default, required)
#   large_client_header_buffers   4 8k;     # (default)

#   client_body_in_file_only        off;    # (default)
    client_max_body_size            8k;

    # SERVER SETTINGS
#   server_name_in_redirect         off;    # (default)
#   port_in_redirect                on;     # (default)
#   recursive_error_pages           off;    # (default)

#   disable_symlinks                on;     # TODO(Vish): Looks like it doesnt work with sony-rpmbuild version of nginx
    server_tokens                   off;    # Not to send Nginx version number

    # HTTP SETTINGS
#   chunked_transfer_encoding       on;     # (default)
#   ignore_invalid_headers          on;     # (default)
#   underscores_in_headers          off;    # (default)
#   if_modified_since               exact;  # (default)

    # TIMEOUTS
    client_header_timeout           30s;    # (default 60s)
    client_body_timeout             60s;    # (default)
    send_timeout                    60s;    # (default)

    # KEEP ALIVE SETTINGS
    keepalive_timeout               60s;    # (default 75s)
    keepalive_requests              25;     # (default 100)

    # PROXY SETTINGS
#   proxy_headers_hash_max_size     512;    # (default)
#   proxy_headers_hash_bucket_size  64;     # (default)

    proxy_max_temp_file_size        0;      # Not to use proxy temp file
    proxy_buffering                 off;    # Not to buffer proxied response
#   proxy_buffer_size               4k;     # (default)
#   proxy_busy_buffers_size         8k;     # (default)
#   proxy_buffers                 8 4k;
    ## COMMENTED OUT, because we set proxy_buffering to off

    proxy_pass_header               Date;   # Pass the Date header of backend
    proxy_pass_header               Server; # Pass the Server header of backend
    proxy_http_version              1.1;    # Recommended for use with 'keepalive'

#   proxy_ignore_client_abort       off;    # (default)
#   proxy_intercept_errors          off;    # (default)
#   proxy_cache                     off;    # (default, required for icons)
#   proxy_connect_timeout           60s;    # (default)
#   proxy_send_timeout              60s;    # (default)
    proxy_read_timeout              60s;    # (default, required)

    # CONNECTION LIMITATIONS
    limit_conn_zone     $server_name zone=perserver:10m;

    # Upstreams
    include /mnt/product/tmp/sony/nginx/data/upstreams/*;

    include /mnt/product/tmp/sony/nginx/conf.d/server.conf;
}
