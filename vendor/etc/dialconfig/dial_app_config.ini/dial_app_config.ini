//
// Application definition file. applied to dial2.2 architecture.
//
//   Application want to be start, hide, stop from dial2.2 application
// framework, should be defined (register) into dial2.2 to be managed
// by DIAL server environment. This application definition file provide
// developer to pre-defined application in your target board environment
// by editing simple form file.
//
// This is an example of real application definition case.
//     Start from [xxxx] is a tag of one application and to store information in dial.
//     The max. length of each application tag is 256 bytes including null end. Each application tag was defined as below.
//
//     Please add "//" on the begining of one line, if you need comment in app.cfg.
//     "URL" used to launch application by Dial Spec defined as below
//     "URL" = "url"&"payload_prefix""PAYLOAD(if need url_encode)"&"additionalData_prefix"="ADDITIONAL_DATA_URL(if need url_encode)""additionalData_suffix"
//     example: BBC iPlayer final "URL": http://www.bbc.co.uk/iplayer/?config=precert&payload&additionalDataurl;
//
//  [Application name]                        // main application name accroding to definite in app.cfg of APM
//    dial_name=Netflix                       // application name is used to communicate between dial server and client. The max. length of path is 256 bytes including null end.
//    platform_name=netflix                   // secondary application name accroding to definite in app.cfg of APM. The max. length of icon_path is 256 bytes including null end.
//    allowed_origin=netflix.com              // Access Control Policy by origin header. The max. length of argv is 256 bytes including null end.
//    url=-Q,source_type=12                   // component of "URL" by each application defined. The max. length of pretty_name is 256 bytes including null end.
//    need_payload=1                          // payload if need send from dial client.
//    payload_prefix=dial=                    // component of "URL" by each application defined. The max. length of pretty_name is 256 bytes including null end.
//    payload_urlEncoded=1                    // payload if need url encode.
//    need_additionalData_url=1               // additionalDataUrl if need send from dial client.
//    additionalData_prefix=                  // component of "URL" by each application defined. The max. length of pretty_name is 256 bytes including null end.
//    additionalData_urlEncoded=0             // additionalDataUrl if need url encode.
//    additionalData_suffix=                  // component of "URL" by each application defined. The max. length of pretty_name is 256 bytes including null end
//    app_library_path=/3rd_rw/libNetflix.so  // using library self to implemnet start, hide, stop and status functions
//    luanchMode=0                            // application launch mode( 0:GAM launch mode; 1: other launch mode )
//    is_support_hide=1                       // application support hide or not
//
//*******************************************************************************
//  platform default configuration
//
//  [PlatformInfo]
//    app_luancher=am                              //launch mode (who does dialserver send app startup command to)
//
//    dial_debug_path=/cache/dial_debug            //dial debug path
//    dial_data_path=/cache/dialserver/            //dial data store path
//
//    default_dial_friendly_name=Mediatek_MTXXXX   //platform friendly name
//    default_dial_manufacture_name=MediaTek Inc.  //platform manufacture name
//    default_dial_mode_name=Mediatek_MTXXXX       //platform mode name
//
//    default_dial_wol_capability=1                //platform wol status
//    default_dial_wow_capability=0                //platform wow status
//
////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////


