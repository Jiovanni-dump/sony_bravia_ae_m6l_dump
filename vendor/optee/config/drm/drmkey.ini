#Note: HDCP RX Key support multiple key path definition
#      The order stands for the priority order, 1st, 2nd, etc.
#Example as below:
#HDCP22_RX_KEY_PATH=/certificate/hdcp2_key.bin,/Customer/hdcp2_key.bin
[HDCP22]
HDCP22_RX_KEY_PATH=/mnt/vendor/certificate/hdcp2_key.bin,/certificate/hdcp2_key.bin,/vendor/tvcertificate/hdcp2_key.bin
HDCP22_TX_KEY_PATH=/mnt/vendor/certificate/hdcp2_tx_key.bin,/certificate/hdcp2_tx_key.bin,/vendor/tvcertificate/hdcp2_tx_key.bin
[WIDEVINE]
WIDEVINE_KEY_PATH=/mnt/vendor/certificate/WVCENC/KeyBox.bin,/vendor/tvcertificate/WVCENC/KeyBox.bin
[PLAYREADY]
PLAYREADY_PRIVATE_KEY_PATH=/vendor/tvcertificate/PLAYREADY25/zgpriv.dat
PLAYREADY_PUBLIC_KEY_PATH=/vendor/tvcertificate/PLAYREADY25/bgroupcert.dat
PLAYREADY30_KEY_PATH=/mnt/vendor/certificate/PLAYREADY30/zgpriv_protected.dat,/mnt/vendor/certificate/PLAYREADYPK/zgpriv_protected.dat,/vendor/tvcertificate/PLAYREADYPK/zgpriv_protected.dat,/certificate/PLAYREADYPK/zgpriv_protected.dat
PLAYREADYPUB30_KEY_PATH=/mnt/vendor/certificate/PLAYREADY30/bgroupcert.dat,/mnt/vendor/certificate/PLAYREADYPK/bgroupcert.dat,/vendor/tvcertificate/PLAYREADYPK/bgroupcert.dat,/certificate/PLAYREADYPK/bgroupcert.dat
[NETFLIX]
NETFLIX_KEY_PATH=/vendor/tvcertificate/netflix/KpeKph
[CHINADRM]
CHINADRM_KEY_PATH=/mnt/vendor/certificate/CHINADRM/key.bin,/vendor/tvcertificate/CHINADRM/key.bin
[KEYMASTER]
KEYMASTER_KEY_PATH=/mnt/vendor/certificate/keymaster/attestkey.bin,/vendor/tvcertificate/keymaster/attestkey.bin
KEYMASTER_IDATTESTATION_PATH=/mnt/vendor/certificate/keymaster/idattestation.bin,/vendor/tvcertificate/keymaster/idattestation.bin
[NETFLIX50]
NETFLIX50_KEY_PATH=/mnt/vendor/certificate/netflix50/KpeKph,/vendor/tvcertificate/netflix50/KpeKph
[NAGRADRM]
NAGRADRM_KEY_PATH=/vendor/tvcertificate/NAGRADRM/NagraKey.bin
[DTCPIP]
DTCPIP_KEY_PATH=/vendor/tvcertificate/DTCPIP/dtcpipkey.bin
[VUDUCA]
VUDUCA_KEY_PATH=/vendor/tvcertificate/Vudu/ca.bin
[VUDUM2M]
VUDUM2M_KEY_PATH=/vendor/tvcertificate/Vudu/m2m.bin
[NETREADYULPK]
NETREADYULPK_KEY_PATH=/vendor/tvcertificate/netready/ulpk.dat
[NETREADYPOTK]
NETREADYPOTK_KEY_PATH=/vendor/tvcertificate/netready/potk.dat
[HDCP14]
HDCP14_KEY_PATH=/mnt/vendor/certificate/hdcp_key.bin,/vendor/tvcertificate/hdcp_key.bin,/certificate/hdcp_key.bin
[OEMPLAY]
OEMPLAY_FPS_KEY_PATH=/mnt/vendor/certificate/oemplay/fps_object.bin,/vendor/tvcertificate/oemplay/fps_object.bin
OEMPLAY_PROVISION_KEY_PATH=/mnt/vendor/certificate/oemplay/provision_object.bin,/vendor/tvcertificate/oemplay/provision_object.bin
[YOUTUBE]
YOUTUBE_AUTH_KEY_PATH=/mnt/vendor/certificate/youtube/key.bin,/vendor/tvcertificate/youtube/key.bin
[DAI]
DAI_KEY_PATH=/application/DAI/config/id.json
[CIPLUS]
CIPLUS_TST_KEY_PATH=/mnt/vendor/certificate/ciplus/ciplus_std.key
CIPLUS_ECP_KEY_PATH=/mnt/vendor/certificate/ciplus/ciplus_ecp.key
[MARLIN_RC9]
MARLIN_RC9_KEY_PATH=/mnt/vendor/certificate/MARLIN/marlin.dat,/vendor/tvcertificate/MARLIN/marlin.dat,/vendor/tvcertificate/marlin.dat,/data/local/tmp/MARLIN/marlin.dat
MARLIN_RC9_AES_KEY_PATH=/mnt/vendor/certificate/MARLIN/aes.dat,/vendor/tvcertificate/MARLIN/aes.dat,/data/local/tmp/MARLIN/aes.dat
MARLIN_RC9_CONFIG_PATH=/mnt/vendor/certificate/MARLIN/config.dat,/vendor/tvcertificate/MARLIN/config.dat,/data/local/tmp/MARLIN/config.dat
[WEBPLATFORM]
WPF_FVP_KEY_PATH=/vendor/tvcertificate/webplatform/fvp_intermediate_key.bin
